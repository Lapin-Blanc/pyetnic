name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches pyetnic.__version__
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import sys

          # pyproject.toml reads the version from pyetnic/__init__.py (dynamic).
          tree = ast.parse(pathlib.Path("pyetnic/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(getattr(t, "id", None) == "__version__" for t in node.targets)
          )
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"

          print(f"Tag: {tag}")
          print(f"Expected: {expected}")

          if tag != expected:
            print("Error: git tag and pyetnic.__version__ do not match.", file=sys.stderr)
            sys.exit(1)
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
